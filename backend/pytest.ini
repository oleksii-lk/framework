[pytest]
asyncio_mode = auto
testpaths = tests
asyncio_default_fixture_loop_scope="function"

# Coverage (pytest-cov)
# Run with: pytest --cov
# or:        pytest --cov --cov-report=html
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage-report
    --cov-fail-under=80
